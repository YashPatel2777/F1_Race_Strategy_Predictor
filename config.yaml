# F1 Race Strategy Predictor - Configuration

data:
  circuit: "Italian Grand Prix"
  seasons:
    - 2022
    - 2023
    - 2024

simulation:
  num_cars: 5
  
safety_car:
  enabled: true
  
vsc:
  enabled: true

training:
  algorithm: "PPO"
  total_timesteps: 500000
  learning_rate: 0.0003
  batch_size: 64
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2

telemetry:
  session_type: "Q"       # Can be 'R', 'Q', 'FP1', 'FP2', 'FP3', 'S', 'SQ'
  distance_interpolation_step: 5.0  # Interpolate every 5 meters for fair comparison
  plot_theme: "dark_background"
